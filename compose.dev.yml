services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - .env
    command: sh -c "sleep 1 && CI=true pnpm install --frozen-lockfile --ignore-scripts && ./node_modules/.bin/next dev --webpack"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - ${DATA_DIR:-./data}:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ipbjaragua
      POSTGRES_PASSWORD: ipbjaragua
      POSTGRES_DB: ipbjaragua
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ipbjaragua -d ipbjaragua']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
