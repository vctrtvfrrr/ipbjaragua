name: validate

on:
  push:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ipbjaragua
          POSTGRES_PASSWORD: ipbjaragua
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U ipbjaragua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable corepack
        run: corepack enable

      - name: Install native build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: Test
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E test
        run: pnpm test:e2e
        env:
          E2E_ADMIN_DATABASE_URL: postgres://ipbjaragua:ipbjaragua@postgres:5432/postgres
          E2E_DATABASE_URL: postgres://ipbjaragua:ipbjaragua@postgres:5432/ipbjaragua_e2e
