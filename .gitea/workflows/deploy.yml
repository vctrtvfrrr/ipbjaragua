name: build-and-deploy

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  REGISTRY: git.codelab.tec.br
  IMAGE: git.codelab.tec.br/codelab/ipbjaragua
  TAG: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --target production \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy stack
        uses: https://git.codelab.tec.br/codelab/deploy-stack@master
        with:
          app: ipbjaragua
          image-tag: ${{ env.TAG }}
        env:
          APPENV_DATABASE_URL: ${{ secrets.DATABASE_URL }}
