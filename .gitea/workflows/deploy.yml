name: build-and-deploy

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  REGISTRY: git.codelab.tec.br
  IMAGE: git.codelab.tec.br/codelab/ipbjaragua
  TAG: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
      volumes:
        - /opt/codelab/apps:/opt/codelab/apps
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            --target production \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy stack
        uses: https://git.codelab.tec.br/codelab/deploy-stack@master
        with:
          app: ipbjaragua
          image-tag: ${{ env.TAG }}
