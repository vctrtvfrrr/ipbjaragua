services:
  ipbjaragua:
    image: git.codelab.tec.br/codelab/ipbjaragua:${IMAGE_TAG:-latest}
    container_name: ipbjaragua
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_DIR:-/opt/data/ipbjaragua}:/app/data
    networks:
      - web
      - postgres
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - 'probe=true'
      - 'probe.url=https://ipbjaragua.org.br'
      - 'probe.mode=public'
      - 'traefik.enable=true'
      - 'traefik.http.routers.ipbjaragua.rule=Host(`ipbjaragua.org.br`) || Host(`www.ipbjaragua.org.br`)'
      - 'traefik.http.routers.ipbjaragua.entrypoints=websecure'
      - 'traefik.http.routers.ipbjaragua.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.ipbjaragua.tls.domains[0].main=ipbjaragua.org.br'
      - 'traefik.http.routers.ipbjaragua.tls.domains[0].sans=www.ipbjaragua.org.br'
      - 'traefik.http.routers.ipbjaragua.middlewares=cf-only@file,ipbjaragua-www-to-apex'
      - 'traefik.http.services.ipbjaragua.loadbalancer.server.port=3000'
      - "traefik.http.middlewares.ipbjaragua-www-to-apex.redirectregex.regex=^https?://www\\.ipbjaragua\\.org\\.br/(.*)"
      - 'traefik.http.middlewares.ipbjaragua-www-to-apex.redirectregex.replacement=https://ipbjaragua.org.br/$${1}'

networks:
  web:
    external: true
  postgres:
    external: true
